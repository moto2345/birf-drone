<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>BIRF 드론 현황판</title>
<!-- v3.3 업체 선택 버전 -->
<style>
:root{--bg:#eef0ec;--card:#fff;--ink:#111418;--sub:#5b6168;--line:#d9ddd6;--fly:#d7263d;--ok:#14833b;--chip:#f2f4f1}
@media (prefers-color-scheme:dark){:root{--bg:#0d0f12;--card:#171a1f;--ink:#f2f3f5;--sub:#a3a9b1;--line:#2a2f36;--fly:#ff4d5e;--ok:#3ccf6e;--chip:#222730}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;padding-bottom:calc(100px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:900px;margin:0 auto;padding:0 10px}
header{position:sticky;top:0;z-index:20;background:#111418;color:#fff}
header .wrap{display:flex;align-items:center;gap:8px;height:52px}
header h1{font-size:16px;margin:0;font-weight:800}
.dot{width:9px;height:9px;border-radius:50%;background:#888;flex:none}
.dot.live{background:#3ccf6e;box-shadow:0 0 0 3px rgba(60,207,110,.25)}.dot.poll{background:#9ad14b}.dot.bad{background:#ff4d5e}
.me{margin-left:auto;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border:0;border-radius:10px;padding:6px 10px;color:#fff;font-weight:700;font-size:13px;max-width:52vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me i{font-size:9px!important;letter-spacing:-.5px}
.me i:empty{width:14px;height:14px}
.me i,.badge{flex:none;width:22px;height:22px;border-radius:50%;background:var(--c);color:#fff;font:800 10px/22px inherit;font-family:inherit;text-align:center;font-style:normal}
.snd{background:rgba(255,255,255,.12);border:0;border-radius:10px;width:36px;height:34px;font-size:16px;flex:none}
.snd.off{opacity:.5}
.warn.net{background:#3a3f46;font-size:13px}
.warn{background:var(--fly);color:#fff;border-radius:12px;padding:10px 12px;font-weight:800;margin:10px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-top:10px}
.mapbox{position:relative;overflow:hidden;background:#2b3a2b}
.mapin{position:relative;width:100%;aspect-ratio:1140/680;cursor:crosshair;user-select:none;touch-action:manipulation}
.mapin img{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pin{position:absolute;transform:translate(-50%,-50%);min-width:48px;height:28px;padding:0 7px;white-space:nowrap;border-radius:14px;background:var(--c);color:#fff;font:800 12px/1 inherit;font-family:inherit;display:grid;place-items:center;border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.55);pointer-events:none;transition:left .3s,top .3s}
.pin::after{content:"";position:absolute;inset:-6px;border-radius:20px;border:3px solid var(--c);animation:pulse2 1.5s ease-out infinite}
@keyframes pulse2{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.35,1.6);opacity:0}}
.pin.mine{min-width:54px;height:32px;border-radius:16px;font-size:13px;border-color:#ffd60a}
.pin.plan{background:rgba(17,20,24,.55);border:2.5px dashed #fff}.pin.plan::after{display:none}
.btns{display:flex;gap:8px;max-width:900px;margin:0 auto}.btns .big{flex:1}.btns .no{flex:none;width:84px;border:1.5px solid var(--line);background:var(--chip);color:var(--ink);border-radius:16px;font-weight:800}
.big.go{background:var(--ok)}
.big.mv{background:#1b4dd8}
.btns.multi .big{font-size:16px;min-height:58px;padding:0 4px}.btns.multi .big small{font-size:11px}.btns.multi .no{width:62px}
.pin.near{box-shadow:0 0 0 3px #d7263d,0 2px 6px rgba(0,0,0,.55)}
@keyframes pulse{0%{transform:scale(.8);opacity:1}100%{transform:scale(1.6);opacity:0}}
.hint{display:flex;align-items:center;gap:8px;padding:9px 12px;font-size:13px;color:var(--sub)}
.hint button{margin-left:auto;background:none;border:0;color:var(--sub);font-weight:700;text-decoration:underline;font-size:12px}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.row .badge{width:auto;min-width:46px;height:26px;padding:0 6px;border-radius:13px;font-size:11.5px;line-height:26px;white-space:nowrap}
.row b{flex:1;font-size:14px}.row small{display:block;color:var(--sub);font-weight:500;font-size:12px}
.st{font-weight:800;font-size:12px;border-radius:999px;padding:5px 10px;background:var(--fly);color:#fff;white-space:nowrap}
.empty{padding:12px;color:var(--sub);font-size:13px;border-top:1px solid var(--line)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(0,0,0,.12)}
.big{width:100%;max-width:900px;display:block;margin:0 auto;border:0;border-radius:16px;min-height:62px;font-size:20px;font-weight:900;color:#fff;background:var(--fly);line-height:1.2}
.big small{display:block;font-size:12px;font-weight:700;opacity:.9}
.bar .tip{text-align:center;font-weight:800;font-size:15px;padding:14px 4px;color:var(--ink)}
.bar .tip small{display:block;color:var(--sub);font-weight:600;font-size:12px}
/* 업체 선택 (한 업체 = 한 줄 버튼) */
.pick{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding:14px 12px calc(14px + env(safe-area-inset-bottom))}
.pick h2{margin:2px 0 2px;font-size:18px}.pick p{margin:0 0 10px;color:var(--sub);font-size:12.5px}
.orgs{display:flex;flex-direction:column;gap:6px;max-width:560px}
.org{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:12px;padding:10px 10px 10px 12px;min-height:54px}
.org.on{border-color:var(--c);box-shadow:inset 0 0 0 1.5px var(--c)}
.oh{flex:1;min-width:0;line-height:1.25}
.oh b{display:block;font-size:15px}.oh span{font-size:11px;font-weight:700;color:var(--c)}
.ds{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:48%}
.ds em{font-style:normal;font-size:12px;font-weight:700;color:var(--sub);background:var(--chip);border-radius:8px;padding:4px 8px;white-space:nowrap}
.orgs .view{border:1.5px dashed var(--line);background:none;border-radius:12px;min-height:44px;font-weight:700;font-size:13px;color:var(--sub);margin-top:2px}
/* 팝업 / 토스트 */
.pops{position:fixed;bottom:calc(98px + env(safe-area-inset-bottom));left:0;right:0;z-index:35;display:flex;flex-direction:column-reverse;align-items:center;gap:8px;padding:0 10px;pointer-events:none}
.pop{pointer-events:auto;width:100%;max-width:520px;background:var(--card);border-radius:16px;border:3px solid var(--c);box-shadow:0 8px 28px rgba(0,0,0,.35);padding:12px 14px;display:flex;gap:12px;align-items:center;animation:popin .25s ease-out}
.pop .badge{width:auto;min-width:54px;height:32px;padding:0 8px;border-radius:16px;line-height:32px;font-size:13px;white-space:nowrap}
.pop .k{font-size:13px;font-weight:900}.pop.fly .k{color:var(--fly)}.pop.land .k{color:var(--ok)}
.pop b{display:block;font-size:17px}.pop small{color:var(--sub)}
.pop.out{opacity:0;transition:opacity .3s}
.pop.nearpop{border-color:var(--fly)}.pop.nearpop .k{color:var(--fly)}
@keyframes popin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.toast{position:fixed;left:50%;top:62px;pointer-events:none;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-weight:700;font-size:14px;z-index:40;display:none;align-items:center;gap:12px;max-width:94vw}
.toast.show{display:flex}
.toast button{pointer-events:auto;white-space:nowrap;flex:none;background:var(--bg);color:var(--ink);border:0;border-radius:8px;padding:6px 10px;font-weight:800}
.unlock{position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:34;background:#1b4dd8;color:#fff;font-weight:800;font-size:14px;padding:11px 16px;border:0;border-radius:999px;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.hidden{display:none!important}
</style>
</head>

  {id:'sr_av', team:'삼락중계팀', org:'원샷스튜디오',      drone:'아바타2',   short:'아바2', color:'#2a4bd7'},
  {id:'gr_m3', team:'그린중계팀', org:'굿데이픽쳐스',      drone:'매빅3',     short:'매빅3', color:'#0b8a3a'},
  {id:'hd_m3', team:'기록영상팀', org:'하드론',            drone:'매빅3',     short:'매빅3', color:'#e8590c'},
  {id:'jd_av', team:'기록영상팀', org:'제이디',            drone:'아바타2',   short:'아바2',  color:'#7b2fbe'},
  {id:'ph_m3', team:'기록사진팀', org:'이미지노마드',      drone:'매빅3',     short:'매빅3', color:'#c2255c'},
  {id:'ts_m3', team:'전체스케치', org:'How Penguins Fly?', drone:'매빅3',     short:'매빅3', color:'#0b7285'},
  {id:'ts_in', team:'전체스케치', org:'How Penguins Fly?', drone:'인스파이어', short:'인스3', color:'#0b7285'}
];
const ZONES = [{id:'그린',x:.114,y:.235},{id:'삼락',x:.263,y:.49},{id:'웨이브',x:.217,y:.797},{id:'히든',x:.647,y:.735},{id:'리버',x:.888,y:.72}];

const $ = s => document.querySelector(s);
const U = Object.fromEntries(UNITS.map(u => [u.id, u]));
const ASPECT = 680/1140;
const LS = { get(k,d){ try{ const v = localStorage.getItem('birf_'+k); return v == null ? d : JSON.parse(v); }catch(_){ return d; } }, set(k,v){ try{ localStorage.setItem('birf_'+k, JSON.stringify(v)); }catch(_){} } };
const qs = new URLSearchParams(location.search);
const API = qs.get('api') || CONFIG.API_URL;
let PUSH = CONFIG.PUSH_BASE;
if (qs.get('push') === 'off') PUSH = '';
else if (/^http:\/\/(localhost|127\.0\.0\.1)/.test(qs.get('push') || '')) PUSH = qs.get('push');
const DEVICE = Math.random().toString(36).slice(2,10);
const S = { units:{}, rev:'', offset:0, lastOk:0, fail:0, push:false, loaded:false };
const pending = {};
const ORGS = [];
UNITS.forEach(u => { let g = ORGS.find(o => o.org === u.org); if (!g){ g = {org:u.org, team:u.team, color:u.color, list:[]}; ORGS.push(g); } g.list.push(u); });
let myOrg = LS.get('org', null);   // null = 아직 선택 안 함, '' = 보기 전용
if (myOrg == null){ const old = LS.get('unit', null); if (old === '') myOrg = ''; else if (old && U[old]) myOrg = U[old].org; if (myOrg != null) LS.set('org', myOrg); } // 이전 버전(드론 단위 선택) 기억값 이어받기
if (myOrg && !ORGS.some(g => g.org === myOrg)) myOrg = null;
const myUnits = () => myOrg ? UNITS.filter(u => u.org === myOrg) : [];
const isMine = id => !!(myOrg && U[id] && U[id].org === myOrg);
const isFly = id => (S.units[id] || {}).s === 'fly';
let pollTimer = null, polling = false, es = null, lastNearKey = '';
let plan = null; // 비행 전, 지도에서 고른 예정 위치

const now = () => Date.now() + S.offset;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const label = id => U[id] ? `${U[id].org} ${U[id].drone}` : id;
const mmss = ms => { const s = Math.max(0, Math.floor(ms/1000)), m = Math.floor(s/60); return m >= 60 ? `${Math.floor(m/60)}시간 ${m%60}분` : `${m}:${String(s%60).padStart(2,'0')}`; };
const vib = p => { try{ navigator.vibrate && navigator.vibrate(p); }catch(_){} };
function fnv(s){ let h = 0x811c9dc5; for (let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(16).padStart(8,'0'); }
const TOPIC = 'birf26-' + fnv(API) + fnv(API.split('').reverse().join(''));
function nearestZone(x, y){ let b = null, bd = 1e9; ZONES.forEach(z => { const d = Math.hypot(z.x-x, (z.y-y)*ASPECT); if (d < bd){ bd = d; b = z; } }); return bd < 0.13 ? b.id : '행사장'; }
let toastT = null, toastUndo = null;
function toast(msg, undo, ms){
  $('#toastMsg').textContent = msg; toastUndo = undo || null;
  $('#toastBtn').classList.toggle('hidden', !undo); $('#toast').classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => { $('#toast').classList.remove('show'); toastUndo = null; }, ms || (undo ? 6000 : 2200));
}

/* ---------- 소리 ---------- */
let soundOn = LS.get('sound', true), AC = null;
const audioOk = () => !!AC && AC.state === 'running';
function unlockAudio(){
  if (!soundOn) return;
  try{
    if (navigator.audioSession){ try{ navigator.audioSession.type = 'playback'; }catch(_){} }
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state !== 'running') AC.resume().then(() => setTimeout(syncUnlock, 400)).catch(()=>{}); else setTimeout(syncUnlock, 400);
  }catch(_){}
}
function syncUnlock(){ $('#unlock').classList.toggle('hidden', !soundOn || audioOk() || myOrg == null); }
function tone(f, at, dur, type, vol){
  const t0 = AC.currentTime + at, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0+.015);
  g.gain.setValueAtTime(vol, t0+dur*.6); g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0+dur+.03);
}
function sfx(k){
  if (!soundOn || !audioOk()) return;
  try{
    if (k === 'fly')  [0,.6].forEach(b => { tone(784,b,.15,'square',.3); tone(1047,b+.17,.15,'square',.3); tone(1319,b+.34,.22,'square',.3); });
    if (k === 'land') { tone(988,0,.18,'triangle',.45); tone(659,.21,.34,'triangle',.45); }
    if (k === 'warn') for (let i=0;i<5;i++) tone(1480,i*.2,.14,'sawtooth',.26);
  }catch(_){}
}
function pop(kind, id, sub){
  const u = U[id], el = document.createElement('div');
  el.className = 'pop ' + (kind === 'warn' ? 'nearpop' : kind); el.style.setProperty('--c', u ? u.color : '#d7263d');
  const k = kind === 'fly' ? '🛫 비행 시작' : kind === 'land' ? '🛬 비행 종료' : '⚠ 가까이 비행 중';
  el.innerHTML = `<i class="badge">${esc(u ? u.short : '!')}</i><div><span class="k">${k}</span><b>${esc(label(id))}</b>${sub ? `<small>${esc(sub)}</small>` : ''}</div>`;
  let done = false; const close = () => { if (done) return; done = true; el.classList.add('out'); setTimeout(() => el.remove(), 300); };
  el.onclick = close; $('#pops').prepend(el);
  while ($('#pops').children.length > 3) $('#pops').lastChild.remove();
  setTimeout(close, kind === 'land' ? 4500 : 9000);
}

/* ---------- 서버(구글 시트) ---------- */
async function api(params, timeout=15000){
  const u = new URL(API);
  Object.entries(params).forEach(([k,v]) => { if (v != null) u.searchParams.set(k, v); });
  u.searchParams.set('_', Date.now());
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), timeout);
  try{ const j = await (await fetch(u, {signal:ctl.signal, cache:'no-store'})).json(); if (!j.ok) throw new Error(j.error); return j; }
  finally{ clearTimeout(t); }
}
function applySnap(j){
  S.rev = j.rev;
  const units = j.units || {};
  new Set([...Object.keys(units), ...Object.keys(S.units)]).forEach(id => {
    const srv = units[id], p = pending[id];
    if (p && Date.now() < p.until && (!srv || srv.t < p.o.t)) return;
    delete pending[id];
    if (srv) S.units[id] = srv; else delete S.units[id];
  });
  S.loaded = true; render();
}
async function poll(){
  if (polling) return; polling = true;
  const t0 = Date.now();
  try{
    const j = await api({a:'get', rev:S.rev});
    S.offset = j.now + (Date.now()-t0)/2 - Date.now();
    if (!j.same) applySnap(j);
    else if (Object.keys(pending).some(id => Date.now() >= pending[id].until)) S.rev = '';
    S.lastOk = Date.now(); S.fail = 0;
  }catch(_){ S.fail++; }
  finally{ polling = false; setDot(); schedule(); }
}
function schedule(){
  clearTimeout(pollTimer); if (document.hidden && S.loaded) return; // 첫 불러오기 실패 시엔 화면이 가려져 있어도 재시도
  const base = S.push ? CONFIG.POLL_SLOW : CONFIG.POLL_FAST;
  pollTimer = setTimeout(poll, S.fail ? Math.min(15000, base*(1+S.fail)) : base);
}
function setDot(){
  const bad = S.fail >= 2 || (S.lastOk && Date.now() - S.lastOk > 20000);
  $('#dot').className = 'dot ' + (bad ? 'bad' : S.push ? 'live' : S.lastOk ? 'poll' : '');
  $('#net').classList.toggle('hidden', !bad);
}

/* ---------- 즉시 알림 (ntfy) ---------- */
function pushSend(id, o, action){
  if (!PUSH) return;
  fetch(`${PUSH}/${TOPIC}`, {method:'POST', body:JSON.stringify({k:'birf1', d:DEVICE, u:id, ...o}), mode:'no-cors', keepalive:true}).catch(()=>{});
  if (action === 'fly' || action === 'land'){
    const q = new URLSearchParams({title: (action === 'fly' ? '🛫 ' : '🛬 ') + label(id) + (action === 'fly' ? ' 비행 시작' : ' 비행 종료'), priority: action === 'fly' ? '5' : '3'});
    fetch(`${PUSH}/${TOPIC}-alert?${q}`, {method:'POST', body:o.z || '행사장', mode:'no-cors', keepalive:true}).catch(()=>{});
  }
}
function pushConnect(){
  if (!PUSH || es || typeof EventSource === 'undefined') return;
  try{ es = new EventSource(`${PUSH}/${TOPIC}/sse`); }catch(_){ es = null; return; }
  es.onopen = () => { S.push = true; setDot(); schedule(); };
  es.onmessage = ev => {
    let d, m; try{ d = JSON.parse(ev.data); m = JSON.parse(d.message); }catch(_){ return; }
    if (d.event && d.event !== 'message') return;
    if (!m || m.k !== 'birf1' || m.d === DEVICE || !U[m.u]) return;
    const o = {s: m.s === 'fly' ? 'fly' : 'land', z:String(m.z||'').slice(0,12), x:num(m.x), y:num(m.y), al:'', n:'', since:+m.since||0, t:+m.t||0};
    const cur = S.units[m.u]; if (cur && cur.t >= o.t) return;
    S.units[m.u] = o; pending[m.u] = {o, until: Date.now() + 20000}; render();
  };
  es.onerror = () => { S.push = false; setDot(); schedule(); if (es && es.readyState === 2){ es = null; setTimeout(pushConnect, 5000); } };
}
const num = v => (v === '' || v == null || !isFinite(+v)) ? null : Math.min(1, Math.max(0, +v));

/* ---------- 내 비행: 지도 탭 = 위치 고르기, 버튼 = 기종별 시작/이동/종료 ---------- */
let chain = Promise.resolve();
function send(id, action, x, y){
  const cur = S.units[id] || {s:'land'};
  const t = Math.round(now());
  const s = action === 'move' ? 'fly' : action;
  const pos = x != null ? {x, y, z: nearestZone(x, y)} : {x:cur.x, y:cur.y, z:cur.z};
  const o = {s, ...pos, al:'', n:'', since: s === 'fly' ? (cur.s === 'fly' && cur.since ? cur.since : t) : 0, t};
  S.units[id] = o; pending[id] = {o, until: Date.now() + 20000};
  pushSend(id, o, action); render();
  chain = chain.then(async () => {
    for (let i=0;i<3;i++){
      try{ const j = await api({a:'set', u:id, s:action, z:o.z, x:o.x, y:o.y}); S.offset = j.now - Date.now(); applySnap(j); S.lastOk = Date.now(); S.fail = 0; setDot(); return; }
      catch(_){ await new Promise(r => setTimeout(r, 1000*(i+1))); }
    }
    toast('⚠ 저장 실패 — 신호가 약해요. 다시 눌러주세요', null, 9000); vib([200,100,200]);
  });
}
$('#map').addEventListener('click', e => {
  if (!myOrg){ if (myOrg === '') toast('보기 전용이에요. 위 버튼에서 내 업체를 고르세요'); return; }
  const r = e.currentTarget.getBoundingClientRect();
  plan = { x: Math.round(Math.min(1, Math.max(0, (e.clientX - r.left)/r.width))*10000)/10000,
           y: Math.round(Math.min(1, Math.max(0, (e.clientY - r.top)/r.height))*10000)/10000 };
  render();
});
function start(id){ if (!plan || !isMine(id)) return; const p = plan; plan = null; send(id, 'fly', p.x, p.y); vib(40); toast(`🛫 ${U[id].drone} 비행 시작 공유됨 · ${nearestZone(p.x, p.y)}`); }
function moveTo(id){ if (!plan || !isMine(id)) return; const p = plan; plan = null; send(id, 'move', p.x, p.y); toast(`📍 ${U[id].drone} 위치 이동 · ${nearestZone(p.x, p.y)}`); }
function land(id){ if (!isMine(id)) return; send(id, 'land'); vib(40); toast(`🛬 ${U[id].drone} 비행 종료 공유됨`); }

/* ---------- 다른 팀 변화 감지 → 소리/팝업 ---------- */
const seen = {}; let baseline = false;
function detect(skipFly){
  if (!S.loaded) return;
  const first = !baseline; baseline = true;
  Object.entries(S.units).forEach(([id, u]) => {
    if (!U[id]) return;
    const prev = seen[id]; seen[id] = {s:u.s, since:u.since};
    if (first || isMine(id) || (prev && prev.s === u.s)) return;
    if (u.s === 'fly'){ if (!skipFly) sfx('fly'); vib([150,70,150,70,300]); pop('fly', id, u.z || ''); }
    else if (prev && prev.s === 'fly'){ sfx('land'); vib(80); pop('land', id, prev.since ? `${Math.round((now()-prev.since)/60000)}분 비행` : ''); }
  });
}
function nears(){   // 같은 업체 기체끼리는 서로 조율하므로 제외
  const fl = Object.entries(S.units).filter(([id,u]) => u.s === 'fly' && U[id] && u.x != null);
  const out = [];
  for (let i=0;i<fl.length;i++) for (let j=i+1;j<fl.length;j++){
    const [a,A] = fl[i], [b,B] = fl[j];
    if (U[a].org !== U[b].org && Math.hypot(A.x-B.x, (A.y-B.y)*ASPECT) < CONFIG.NEAR) out.push([a,b]);
  }
  return out;
}

/* ---------- 화면 ---------- */
const pinEls = {};
function render(){
  const nr = nears(), nearSet = new Set(nr.flat());
  const mine = nr.filter(p => isMine(p[0]) || isMine(p[1])), key = mine.map(p => p.join()).join();
  const myNew = S.loaded && key && key !== lastNearKey;
  detect(myNew);
  if (myNew){ const other = isMine(mine[0][0]) ? mine[0][1] : mine[0][0]; sfx('warn'); vib([300,100,300,100,300]); pop('warn', other, '위치·고도 확인하세요'); }
  lastNearKey = key;
  $('#warn').innerHTML = nr.map(([a,b]) => `<div class="warn">⚠ 가까이 비행 중 · ${esc(label(a))} / ${esc(label(b))}</div>`).join('');

  // 지도 핀 (비행 중만)
  const fl = Object.entries(S.units).filter(([id,u]) => u.s === 'fly' && U[id]);
  const placed = [], keep = new Set();
  fl.forEach(([id,u]) => {
    let x = u.x ?? .5, y = u.y ?? .08, k = 0;
    const OFF = [[0,0],[0,.14],[0,-.14],[.15,0],[-.15,0],[.15,.14],[-.15,.14],[.15,-.14],[-.15,-.14]], bx = x, by = y;
    while (placed.some(q => Math.abs(q.x-x) < .14 && Math.abs(q.y-y) < .13) && k < OFF.length-1){ k++; x = bx + OFF[k][0]; y = by + OFF[k][1]; }
    placed.push({x,y}); keep.add(id);
    let el = pinEls[id]; if (!el){ el = document.createElement('div'); $('#map').appendChild(el); pinEls[id] = el; }
    el.className = 'pin' + (isMine(id) ? ' mine' : '') + (nearSet.has(id) ? ' near' : '');
    el.style.setProperty('--c', U[id].color); el.style.left = x*100 + '%'; el.style.top = y*100 + '%'; el.textContent = U[id].short;
  });
  const mu = myUnits();
  if (plan && mu.length){
    keep.add('_plan'); let el = pinEls._plan; if (!el){ el = document.createElement('div'); $('#map').appendChild(el); pinEls._plan = el; }
    el.className = 'pin plan'; el.style.setProperty('--c', mu[0].color); el.style.left = plan.x*100 + '%'; el.style.top = plan.y*100 + '%'; el.textContent = '여기';
  }
  Object.keys(pinEls).forEach(k => { if (!keep.has(k)){ pinEls[k].remove(); delete pinEls[k]; } });

  // 목록
  fl.sort((a,b) => (a[1].since||0) - (b[1].since||0));
  $('#cnt').textContent = fl.length ? `${fl.length}대` : '';
  $('#list').innerHTML = fl.length ? fl.map(([id,u]) => `<div class="row" style="--c:${U[id].color}"><i class="badge">${esc(U[id].short)}</i><b>${esc(label(id))}<small>${esc(U[id].team)} · ${esc(u.z || '')}</small></b><span class="st" data-since="${u.since}">${mmss(now()-u.since)}</span></div>`).join('')
    : `<div class="empty">${S.loaded ? '비행 중인 드론이 없어요' : '불러오는 중…'}</div>`;

  // 상단 내 업체 + 하단 버튼
  const g = ORGS.find(o => o.org === myOrg);
  $('#meBtn').innerHTML = g ? `<i style="--c:${g.color}"></i>${esc(g.org)} ▾` : '👀 보기 전용 ▾';
  const multi = mu.length > 1, myFl = mu.filter(u => isFly(u.id));
  $('#hint').textContent = !myOrg ? '깜빡이는 핀 = 비행 중'
    : plan ? '점선 핀 위치가 맞으면 아래 버튼을 누르세요'
    : myFl.length ? (multi ? '비행 중 · 위치를 옮기거나 다른 기체를 띄우려면 지도를 누르세요' : '비행 중 · 위치를 옮기려면 지도를 누르세요')
    : '👆 지도에서 비행할 위치를 누르세요';
  const zone = plan ? esc(nearestZone(plan.x, plan.y)) : '';
  const timeOf = u => `<span data-since="${S.units[u.id].since}">${mmss(now()-S.units[u.id].since)}</span>`;
  $('#bar').innerHTML = !myOrg ? `<div class="tip">보기 전용<small>상단 버튼에서 내 업체를 고르면 비행을 알릴 수 있어요</small></div>`
    : plan ? `<div class="btns${multi ? ' multi' : ''}">` + mu.map(u => isFly(u.id)
          ? `<button class="big mv" data-mv="${u.id}">📍 ${multi ? esc(u.drone) + ' 이동' : '여기로 이동'}<small>${zone}</small></button>`
          : `<button class="big go" data-go="${u.id}">🛫 ${multi ? esc(u.drone) + ' 시작' : '여기서 비행 시작'}<small>${multi ? zone : esc(u.drone) + ' · ' + zone + ' · 모든 팀에 알림'}</small></button>`).join('') +
        `<button class="no" id="noBtn">취소</button></div>`
    : myFl.length ? `<div class="btns${myFl.length > 1 ? ' multi' : ''}">` + myFl.map(u => `<button class="big" data-land="${u.id}">🛬 ${multi ? esc(u.drone) + ' ' : '비행 '}종료<small>${esc(S.units[u.id].z || '')} · ${timeOf(u)}</small></button>`).join('') + `</div>`
    : `<div class="tip">👆 지도에서 비행할 위치를 누르세요<small>${multi ? '위치를 고르면 기종별 시작 버튼이 나와요' : '위치를 고른 뒤 시작 버튼을 누르면 모든 팀에 알려집니다'}</small></div>`;
  syncUnlock();
}
function showPick(){
  $('#pick').innerHTML = `<h2>내 업체를 선택하세요</h2><p>기종은 이륙할 때 고르면 돼요 · 이 폰에 기억됨</p><div class="orgs">` +
    ORGS.map(g => `<button class="org${g.org === myOrg ? ' on' : ''}" data-org="${esc(g.org)}" style="--c:${g.color}"><span class="oh"><b>${esc(g.team)}</b><span>${esc(g.org)}</span></span><span class="ds">` +
      g.list.map(u => `<em>${esc(u.drone)}</em>`).join('') + `</span></button>`).join('') +
    `<button class="view" data-org="">👀 보기만 할게요 (관제·연출)</button></div>`;
  $('#pick').classList.remove('hidden');
}
setInterval(() => document.querySelectorAll('[data-since]').forEach(el => { const s = +el.dataset.since; if (s) el.textContent = mmss(now()-s); }), 1000);
setInterval(() => { setDot(); if (S.loaded) render(); }, 15000);

document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.org != null){ myOrg = t.dataset.org; LS.set('org', myOrg); plan = null; $('#pick').classList.add('hidden'); render(); if (myOrg){ const g = ORGS.find(o => o.org === myOrg); toast(`${g.team} · ${myOrg} 선택됨 · 지도를 눌러 비행 시작`); } return; }
  if (t.dataset.go) return start(t.dataset.go);
  if (t.dataset.mv) return moveTo(t.dataset.mv);
  if (t.dataset.land) return land(t.dataset.land);
  if (t.id === 'noBtn'){ plan = null; return render(); }
  if (t.id === 'unlock'){ soundOn = true; LS.set('sound', true); unlockAudio(); t.classList.add('hidden'); toast('🔔 알림 소리 켜짐'); return; }
  if (t.id === 'meBtn'){ if (myUnits().some(u => isFly(u.id))){ toast('비행 중에는 바꿀 수 없어요. 먼저 종료를 눌러주세요'); return; } return showPick(); }
  if (t.id === 'toastBtn'){ if (toastUndo){ const f = toastUndo; toastUndo = null; f(); toast('취소했어요'); } return; }
  if (t.id === 'sndBtn'){ soundOn = !soundOn; LS.set('sound', soundOn); t.textContent = soundOn ? '🔔' : '🔕'; t.classList.toggle('off', !soundOn); if (soundOn) unlockAudio(); toast(soundOn ? '🔔 알림 소리 켜짐' : '🔕 소리 꺼짐 (팝업·진동은 유지)'); syncUnlock(); return; }
});
['pointerdown','touchend','click','keydown'].forEach(ev => document.addEventListener(ev, () => { if (soundOn && !audioOk()) unlockAudio(); }, {passive:true, capture:true}));
document.addEventListener('visibilitychange', () => { if (document.hidden){ clearTimeout(pollTimer); return; } if (AC && AC.state !== 'running') AC.resume().catch(()=>{}); poll(); if (!es) pushConnect(); });
window.addEventListener('online', () => { poll(); if (!es) pushConnect(); });

$('#sndBtn').textContent = soundOn ? '🔔' : '🔕'; $('#sndBtn').classList.toggle('off', !soundOn);
if (myOrg == null) showPick();
render(); poll(); pushConnect();
</script>
</body>
</html>
